name: Release Smoke Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify starter laws and CLI decisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RIL v0.2.1 (SHA-256 verified)
        run: |
          sh ./install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify starter law packs
        run: |
          ril --version
          for f in examples/*/laws.ril; do
            echo "Checking $f..."
            ril laws check "$f"
          done

      - name: Verify offline action evaluation and fail-closed precedence
        run: |
          expect_exit() {
            local expected=$1 status=0
            shift
            "$@" || status=$?
            if [ "$status" -ne "$expected" ]; then
              printf 'Expected exit %s, got %s\n' "$expected" "$status" >&2
              return 1
            fi
          }
          expect_exit 3 ril laws eval examples/claude-code-mcp/laws.ril --action exec --resource ShellCommand:bash --context '{"command":"rm -rf /","workspace":"local"}'
          expect_exit 2 ril laws eval examples/claude-code-mcp/laws.ril --action exec --resource ShellCommand:bash --context '{"command":"curl https://example.com","workspace":"local"}'
          expect_exit 0 ril laws eval examples/claude-code-mcp/laws.ril --action exec --resource ShellCommand:bash --context '{"command":"cargo test","workspace":"local"}'

      - name: Verify PR law-weakening diff detector
        run: |
          weakened=$(mktemp)
          trap 'rm -f "$weakened"' EXIT
          grep -v '^[[:space:]]*forbid.*rm -rf' examples/claude-code-mcp/laws.ril > "$weakened"
          ril laws check "$weakened"
          status=0
          ril laws diff examples/claude-code-mcp/laws.ril "$weakened" || status=$?
          test "$status" -eq 1
