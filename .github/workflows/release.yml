name: Publish RIL SDKs

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish-pypi:
    name: Publish Python SDK (retvest-ril) to PyPI
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'retvest/RIL'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Python sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build sdks/python
      - name: Publish to PyPI via OIDC Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: sdks/python/dist/

  publish-npm:
    name: Publish TypeScript SDK (@retvest/ril) to npm
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'retvest/RIL' && vars.ENABLE_NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm with provenance
        working-directory: sdks/ts
        run: npm publish --provenance --access public
